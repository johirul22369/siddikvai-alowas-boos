<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIDDIK OFFICIAL ORIGINAL AI HACK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Hind+Siliguri:wght@700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', 'Montserrat', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* ব্যাকগ্রাউন্ড গেম ফ্রেম */
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ফ্লোটিং ড্র্যাগেবল আইকন */
        .floating-icon {
            position: fixed;
            top: 100px;
            right: 20px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            background: #000;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.9);
            z-index: 9999;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
        }

        .floating-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* ড্র্যাগেবল পপআপ মডাল (তোর দেওয়া অরিজিনাল ইমেজের পপআপ ব্যাকগ্রাউন্ড) */
        .overlay-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 360px;
            height: 480px;
            background: url('https://imagepaste.org/i/sjtf7ag5.png') no-repeat center center;
            background-size: 100% 100%;
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
            z-index: 10000;
            touch-action: none;
            user-select: none;
        }

        /* পপআপ ড্র্যাগ হেডার ও ক্লোজ বাটন */
        .popup-header {
            width: 100%;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            cursor: move;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            margin-left: auto;
        }

        /* পাসওয়ার্ড স্ক্রিন */
        .auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            height: calc(100% - 45px);
            padding: 20px;
        }

        .auth-desc {
            font-size: 14px;
            color: #ffd700;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .input-box {
            width: 85%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #ffd700;
            background: rgba(0, 0, 0, 0.85);
            color: #ffd700;
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            outline: none;
        }

        .btn-action {
            width: 85%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ffd700, #d97706);
            color: #000;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.6);
        }

        /* প্রেডিকশন ওভারলে (ইমেজের একদম নির্দিষ্ট মাঝখানে সেট করার জন্য) */
        .dashboard-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100% - 45px);
            position: relative;
            padding: 20px;
        }

        .prediction-display {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px #ffd700, 0 0 30px #ff4500;
            letter-spacing: 1px;
        }

        .status-text {
            position: absolute;
            top: 62%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #38bdf8;
            font-weight: 800;
            white-space: nowrap;
        }

        .get-signal-trigger {
            position: absolute;
            bottom: 30px;
            width: 85%;
            height: 48px;
            background: transparent;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ১. ব্যাকগ্রাউন্ড গেম ফ্রেম (রেফারেল লিংক) -->
    <iframe class="game-frame" src="https://hgnice.bet/#/register?invitationCode=68758106622"></iframe>

    <!-- ২. ফ্লোটিং ড্র্যাগেবল আইকন -->
    <div class="floating-icon" id="dragIcon">
        <img src="https://cdn.imageurlgenerator.com/uploads/3420d277-7bc7-4882-aa5e-11d91ee5e9e8.jpg" alt="Icon">
    </div>

    <!-- ৩. ড্র্যাগেবল পপআপ (অরিজিনাল ইমেজ ব্যাকগ্রাউন্ড) -->
    <div class="overlay-modal" id="overlayModal">
        <div class="popup-header" id="popupHeader">
            <button class="close-btn" onclick="toggleModal()">&times;</button>
        </div>

        <!-- সিকিউরিটি পাসওয়ার্ড স্ক্রিন -->
        <div class="auth-screen" id="authScreen">
            <div class="auth-desc">🔑 SIDDIK AI VIP ACCESS</div>
            <input type="password" id="passInput" class="input-box" placeholder="পাসওয়ার্ড দিন">
            <button class="btn-action" onclick="verifyPassword()">UNLOCK HACK</button>
            <p id="errorMsg" style="color: #ff4d4d; font-size: 11px; font-weight: 700; display: none;">❌ ভুল পাসওয়ার্ড!</p>
        </div>

        <!-- ইমেজের ওপর লাইভ প্রেডিকশন ডিসপ্লে -->
        <div class="dashboard-screen" id="dashScreen">
            <div class="prediction-display" id="predResult">2.10x</div>
            <div class="status-text" id="statusText">AUTO CASHOUT @ 2.10X</div>
            <button class="get-signal-trigger" onclick="getSignal()"></button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('overlayModal');

        function toggleModal() {
            modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
        }

        // পাসওয়ার্ড ভেরিফিকেশন (siddik58)
        function verifyPassword() {
            let input = document.getElementById('passInput').value;
            let errorMsg = document.getElementById('errorMsg');

            if (input === 'siddik58') {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('dashScreen').style.display = 'flex';
                errorMsg.style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // সিগন্যাল জেনারেটর
        function getSignal() {
            let predResult = document.getElementById('predResult');
            let statusText = document.getElementById('statusText');

            predResult.innerText = "WAIT...";
            statusText.innerText = "ANALYZING GAME DATA...";

            setTimeout(() => {
                let targetVal = (Math.random() * (4.80 - 1.35) + 1.35).toFixed(2);
                predResult.innerText = targetVal + "x";
                statusText.innerText = "AUTO CASHOUT @ " + targetVal + "X";
            }, 1200);
        }

        // ১. আইকন ড্র্যাগ (Icon Movement)
        const dragIcon = document.getElementById('dragIcon');
        makeElementDraggable(dragIcon, dragIcon);

        // ২. পপআপ উইন্ডো ড্র্যাগ (Popup Window Movement)
        const popupHeader = document.getElementById('popupHeader');
        makeElementDraggable(modal, popupHeader);

        function makeElementDraggable(element, handle) {
            let isDragging = false, initialX, initialY;

            handle.addEventListener('touchstart', dragStart, {passive: false});
            window.addEventListener('touchend', dragEnd);
            window.addEventListener('touchmove', drag, {passive: false});

            handle.addEventListener('mousedown', dragStart);
            window.addEventListener('mouseup', dragEnd);
            window.addEventListener('mousemove', drag);

            function dragStart(e) {
                if (e.target.classList.contains('close-btn')) return;
                isDragging = true;
                let clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;

                initialX = clientX - element.offsetLeft;
                initialY = clientY - element.offsetTop;
            }

            function dragEnd() {
                isDragging = false;
            }

            function drag(e) {
                if (!isDragging) return;
                e.preventDefault();

                let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;

                let x = clientX - initialX;
                let y = clientY - initialY;

                let maxX = window.innerWidth - element.offsetWidth / 2;
                let maxY = window.innerHeight - element.offsetHeight / 2;

                element.style.left = x + "px";
                element.style.top = y + "px";
                element.style.transform = "none";
                element.style.position = 'fixed';
            }
        }

        let clickTime = 0;
        dragIcon.addEventListener('mousedown', () => clickTime = Date.now());
        dragIcon.addEventListener('touchstart', () => clickTime = Date.now());
        
        dragIcon.addEventListener('mouseup', () => { if (Date.now() - clickTime < 200) toggleModal(); });
        dragIcon.addEventListener('touchend', () => { if (Date.now() - clickTime < 200) toggleModal(); });
    </script>
</body>
</html>
