        /* জলজল করা রেইনবো গ্রেডিয়েন্ট অ্যানিমেশন */
        @keyframes luxuryGlow {

<body>

        <!-- টেলিগ্রাম লোগোসহ সাপোর্ট এডমিন বাটন -->

    <script>
        let isUnlocked = localStorage.getItem("siddik_hack_unlocked") === "true";
        const totalDuration = 30;

        function handleIconClick() {
            if (isUnlocked) {
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('floating-icon-btn').style.display = 'none';
                startPeriodGenerator();
            } else {
                document.getElementById('auth-overlay').style.display = 'block';
            }
        }

        function checkPassword() {
            const pass = document.getElementById('pass-input').value;
            const rememberMe = document.getElementById('remember-pass').checked;

            if (pass === "SIDDIK58") {
                isUnlocked = true;
                if (rememberMe) {
                    localStorage.setItem("siddik_hack_unlocked", "true");
                }
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('floating-icon-btn').style.display = 'none';
                startPeriodGenerator();
            } else {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('pass-input').value = "";
            }
        }

        function hidePopup() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('floating-icon-btn').style.display = 'flex';
        }

        function getNumBadgeStyle(num) {
            let colorHex = "";
            let shadowHex = "";

            if (num === 0 || num === 5) {
                colorHex = "#c084fc";
                shadowHex = "rgba(192, 132, 252, 0.8)";
            } else if (num === 1 || num === 3 || num === 7 || num === 9) {
                colorHex = "#22c55e";
                shadowHex = "rgba(34, 197, 94, 0.8)";
            } else {
                colorHex = "#ef4444";
                shadowHex = "rgba(239, 68, 68, 0.8)";
            }

            return {
                text: `${num}`,
                style: `color: ${colorHex}; border: 1px solid ${colorHex}; box-shadow: 0 0 5px ${shadowHex};`
            };
        }

        function startPeriodGenerator() {
            function update() {
                if (!isUnlocked) return;

                const now = new Date();
                const totalSecs = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
                let periodIndex = Math.floor(totalSecs / totalDuration) + 1;
                let dateStr = `${now.getUTCFullYear()}${String(now.getUTCMonth() + 1).padStart(2, '0')}${String(now.getUTCDate()).padStart(2, '0')}`;
                
                let fullPeriodNumber = `P ${dateStr}30${String(10000 + periodIndex).slice(-4)}`;
                let timeLeft = totalDuration - (totalSecs % totalDuration);

                document.getElementById('period').innerText = fullPeriodNumber;
                document.getElementById('timer-text').innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;

                let sizeEl = document.getElementById('res-size');
                let numRow = document.getElementById('num-row');
                let num1El = document.getElementById('num-1');
                let num2El = document.getElementById('num-2');
                let pDot = document.getElementById('p-dot');
                let inlineProgress = document.getElementById('inline-progress');
                let scoreLabel = document.getElementById('score-text');

                if (timeLeft >= 28) {
                    let elapsedSteps = 30 - timeLeft + 1;
                    let loadingProgress = (elapsedSteps / 3) * 100;
                    inlineProgress.style.width = loadingProgress + "%";
                    
                    let dummyScore = elapsedSteps * 33;
                    scoreLabel.innerText = `SCORE ${dummyScore}%`;

                    sizeEl.innerText = "LOADING...";
                    sizeEl.style.fontSize = "11px";
                    sizeEl.style.background = "none";
                    sizeEl.style.webkitTextFillColor = "#38bdf8";
                    sizeEl.style.filter = "none";
                    numRow.style.display = "none";
                    pDot.style.background = "#38bdf8";
                    pDot.style.boxShadow = "0 0 4px #38bdf8";
                } else {
                    inlineProgress.style.width = "100%";
                    scoreLabel.innerText = `SCORE 98%`;
                    sizeEl.style.fontSize = "17px";

                    let seed = parseInt(fullPeriodNumber.replace('P ', ''));
                    let x = Math.sin(seed * 73.156) * 10000;
                    let randomFactor = Math.abs(x - Math.floor(x));
                    let isBig = (seed % 2 === 0);
                    if (randomFactor > 0.45) isBig = !isBig;

                    sizeEl.innerText = isBig ? "BIG" : "SMALL";
                    sizeEl.style.background = "linear-gradient(270deg, #00ffcc, #ff007f, #ffff00, #00ffff, #ff3333, #22c55e)";
                    sizeEl.style.backgroundSize = "400% 400%";
                    sizeEl.style.webkitBackgroundClip = "text";
                    sizeEl.style.webkitTextFillColor = "transparent";
                    sizeEl.style.filter = "drop-shadow(0 0 8px rgba(0, 255, 204, 0.8))";

                    // সিগন্যাল অনুযায়ী ছোট ডটের কালার (Big হলে Red, Small হলে Green)
                    if (isBig) {
                        pDot.style.background = "#ef4444";
                        pDot.style.boxShadow = "0 0 4px #ef4444";
                    } else {
                        pDot.style.background = "#22c55e";
                        pDot.style.boxShadow = "0 0 4px #22c55e";
                    }

                    let n1, n2;
                    if (isBig) {
                        n1 = 5 + (seed % 3);
                        n2 = 5 + ((seed + 2) % 4);
                        if (n1 === n2) n2 = 5 + ((n1 + 1) % 5);
                    } else {
                        n1 = seed % 3;
                        n2 = (seed + 2) % 5;
                        if (n1 === n2) n2 = (n1 + 2) % 5;
                    }

                    let info1 = getNumBadgeStyle(n1);
                    let info2 = getNumBadgeStyle(n2);

                    num1El.innerText = info1.text;
                    num1El.style.cssText = info1.style;

                    num2El.innerText = info2.text;
                    num2El.style.cssText = info2.style;

                    numRow.style.display = "flex";
                }

                setTimeout(update, 1000);
            }
            update();
        }

        makeDraggable(document.getElementById("floating-icon-btn"));
        makeDraggable(document.getElementById("main-content"));

        function makeDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elmnt.onmousedown = dragMouseDown;
            elmnt.ontouchstart = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                let clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
                pos3 = clientX;
                pos4 = clientY;
                document.onmouseup = closeDragElement;
                document.ontouchend = closeDragElement;
                document.onmousemove = elementDrag;
                document.ontouchmove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                elmnt.style.transform = "none";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.ontouchend = null;
                document.onmousemove = null;
                document.ontouchmove = null;
            }
        }
    </script>
