<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIDDIK OFFICIAL ORIGINAL AI HACK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Montserrat:wght@700;800;900&family=Hind+Siliguri:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Hind Siliguri', sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* ব্যাকগ্রাউন্ড ফুল স্ক্রিন গেম ফ্রেম (রেফারেল লিংক) */
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ফ্লোটিং ড্র্যাগেবল আইকন (স্ক্রিন ওপেন করার জন্য) */
        .floating-icon {
            position: fixed;
            top: 100px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2.5px solid #ffd700;
            background: #000;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.9);
            z-index: 9999;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .floating-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* স্ক্রিনশটের হুবহু ড্র্যাগেবল পপআপ উইন্ডো[span_4](start_span)[span_4](end_span) */
        .overlay-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            max-width: 375px;
            background: linear-gradient(145deg, #100c1c, #07060b);
            border: 2px solid #38bdf8;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95), 0 0 30px rgba(56, 189, 248, 0.35);
            z-index: 10000;
            padding: 12px;
            color: #fff;
            touch-action: none;
        }

        /* পপআপের টপ ড্র্যাগ হেডার (স্ক্রিনশট স্টایل)[span_5](start_span)[span_5](end_span) */
        .radar-header {
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            cursor: move;
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-title {
            font-size: 10px;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 0.5px;
        }

        .radar-badge {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 5px;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        /* পাসওয়ার্ড লগইন স্ক্রিন */
        .auth-screen {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px 5px;
            text-align: center;
        }

        .input-box {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid rgba(255, 215, 0, 0.4);
            background: #000;
            color: #ffd700;
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            outline: none;
        }

        /* মেইন পপআপ ড্যাশবোর্ড */
        .dashboard-screen {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        /* গেম মোড ট্যাব (Aviator & WinGo একসাথে)[span_6](start_span)[span_6](end_span) */
        .mode-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 3px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .m-tab {
            padding: 7px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        .m-tab.active {
            background: linear-gradient(135deg, #ffd700, #d97706);
            color: #000;
        }

        /* স্ট্যাটাস বার[span_7](start_span)[span_7](end_span) */
        .sub-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            color: #cbd5e1;
            padding: 0 2px;
        }

        .safe-tag {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.15);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(74, 222, 128, 0.3);
            font-size: 10px;
        }

        /* গ্রাফ বা প্রেডিকশন বক্স[span_8](start_span)[span_8](end_span) */
        .graph-box {
            position: relative;
            background: radial-gradient(circle, rgba(30, 10, 60, 0.9) 0%, rgba(5, 2, 15, 0.98) 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 14px;
            padding: 18px 10px;
            overflow: hidden;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .graph-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(255, 75, 43, 0.25), transparent);
            clip-path: polygon(0 100%, 10% 80%, 30% 70%, 50% 50%, 75% 30%, 100% 5%, 100% 100%);
        }

        .cashout-locked {
            display: inline-block;
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .prediction-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            margin-bottom: 2px;
            position: relative;
            z-index: 2;
        }

        .auto-cashout-text {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 700;
            position: relative;
            z-index: 2;
        }

        /* WinGo স্পেশাল স্টাইল */
        .wingo-res {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            font-weight: 900;
            color: #facc15;
            margin: 6px 0;
            position: relative;
            z-index: 2;
        }

        /* গেট সিগন্যাল বাটন[span_9](start_span)[span_9](end_span) */
        .btn-action {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #fff;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 18px rgba(255, 75, 43, 0.5);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- ব্যাকগ্রাউন্ড গেম ফ্রেম (রেফারেল লিংক) -->
    <iframe class="game-frame" src="https://hgnice.bet/#/register?invitationCode=68758106622"></iframe>

    <!-- ফ্লোটিং আইকন -->
    <div class="floating-icon" id="dragIcon">
        <img src="https://cdn.imageurlgenerator.com/uploads/3420d277-7bc7-4882-aa5e-11d91ee5e9e8.jpg" alt="Icon">
    </div>

    <!-- পপআপ মডাল (স্ক্রিনশটের হুবহু লেআউট)[span_10](start_span)[span_10](end_span) -->
    <div class="overlay-modal" id="overlayModal">
        
        <!-- ড্র্যাগ হেডার -->
        <div class="radar-header" id="dragHeader">
            <div class="header-title-wrap">
                <span class="brand-title">SIDDIK HACK</span>
                <span class="radar-badge">CRASH RADAR</span>
            </div>
            <button class="close-btn" onclick="toggleModal()">&times;</button>
        </div>

        <!-- পাসওয়ার্ড স্ক্রিন -->
        <div class="auth-screen" id="authScreen">
            <div style="font-size: 13px; color: #ffd700; font-weight: 700;">🔒 SIDDIK VIP PASSWORD</div>
            <input type="password" id="passInput" class="input-box" placeholder="পাসওয়ার্ড দিন (siddik58)">
            <button class="btn-action" onclick="verifyPassword()">UNLOCK HACK</button>
            <p id="errorMsg" style="color: #ff4d4d; font-size: 11px; font-weight: 700; display: none;">❌ ভুল পাসওয়ার্ড!</p>
        </div>

        <!-- ড্যাশবোর্ড স্ক্রিন (Aviator + WinGo) -->
        <div class="dashboard-screen" id="dashScreen">
            
            <!-- মোড সুইচ ট্যাব -->
            <div class="mode-tabs">
                <button class="m-tab active" id="tabAviator" onclick="switchMode('aviator')">✈️ AVIATOR</button>
                <button class="m-tab" id="tabWingo" onclick="switchMode('wingo')">🎯 WINGO</button>
            </div>

            <div class="sub-header">
                <span id="serverTitle">SPRIBE AVIATOR AI #2</span>
                <span class="safe-tag">🛡️ 96.2% SAFE</span>
            </div>

            <!-- AVIATOR VIEW -->
            <div class="graph-box" id="aviatorView">
                <div class="graph-line"></div>
                <div class="cashout-locked">🔒 CASHOUT LOCKED</div>
                <div class="prediction-display" id="predResult">2.10x</div>
                <div class="auto-cashout-text" id="autoText">AUTO CASHOUT @ 2.10X</div>
            </div>

            <!-- WINGO VIEW -->
            <div class="graph-box" id="wingoView" style="display: none;">
                <div class="cashout-locked" id="wingoPeriod">PERIOD #2026111201</div>
                <div class="wingo-res" id="wingoSize">BIG</div>
                <div class="auto-cashout-text" id="wingoDesc">WINNER COLOR: GREEN (7)</div>
            </div>

            <button class="btn-action" id="signalBtn" onclick="getSignal()">⚡ GET SIGNAL ⚡</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('overlayModal');
        let currentMode = 'aviator';

        function toggleModal() {
            modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
        }

        // পাসওয়ার্ড চেক (siddik58)
        function verifyPassword() {
            let input = document.getElementById('passInput').value;
            let errorMsg = document.getElementById('errorMsg');

            if (input === 'siddik58') {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('dashScreen').style.display = 'flex';
                errorMsg.style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // গেম মোড পরিবর্তন
        function switchMode(mode) {
            currentMode = mode;
            const tA = document.getElementById('tabAviator');
            const tW = document.getElementById('tabWingo');
            const vA = document.getElementById('aviatorView');
            const vW = document.getElementById('wingoView');
            const sTitle = document.getElementById('serverTitle');

            if (mode === 'aviator') {
                tA.classList.add('active');
                tW.classList.remove('active');
                vA.style.display = 'flex';
                vW.style.display = 'none';
                sTitle.innerText = 'SPRIBE AVIATOR AI #2';
            } else {
                tW.classList.add('active');
                tA.classList.remove('active');
                vA.style.display = 'none';
                vW.style.display = 'flex';
                sTitle.innerText = 'WINGO 1MIN RADAR';
                updatePeriod();
            }
        }

        function updatePeriod() {
            const now = new Date();
            const mins = now.getHours() * 60 + now.getMinutes() + 1;
            document.getElementById('wingoPeriod').innerText = `PERIOD #20261112${String(mins).padStart(4, '0')}`;
        }

        // সিগন্যাল জেনারেটর
        function getSignal() {
            let btn = document.getElementById('signalBtn');
            btn.disabled = true;
            btn.innerText = "ANALYZING...";

            if (currentMode === 'aviator') {
                let predResult = document.getElementById('predResult');
                let autoText = document.getElementById('autoText');
                predResult.innerText = "---";
                autoText.innerText = "CALCULATING MULTIPLIER...";

                setTimeout(() => {
                    let targetVal = (Math.random() * (4.80 - 1.40) + 1.40).toFixed(2);
                    predResult.innerText = targetVal + "x";
                    autoText.innerText = "AUTO CASHOUT @ " + targetVal + "X";
                    btn.innerText = "⚡ GET SIGNAL ⚡";
                    btn.disabled = false;
                }, 1200);
            } else {
                updatePeriod();
                let sizeEl = document.getElementById('wingoSize');
                let descEl = document.getElementById('wingoDesc');
                sizeEl.innerText = "---";

                setTimeout(() => {
                    let num = Math.floor(Math.random() * 10);
                    let isBig = num >= 5;
                    let color = [1, 3, 5, 7, 9].includes(num) ? 'GREEN' : 'RED';
                    
                    sizeEl.innerText = isBig ? 'BIG' : 'SMALL';
                    sizeEl.style.color = isBig ? '#facc15' : '#38bdf8';
                    descEl.innerText = `WINNER COLOR: ${color} (${num})`;
                    btn.innerText = "⚡ GET SIGNAL ⚡";
                    btn.disabled = false;
                }, 1200);
            }
        }

        // ১. ফ্লোটিং আইকন ড্র্যাগ ও ইনস্ট্যান্ট ক্লিক হ্যান্ডলার
        const dragIcon = document.getElementById('dragIcon');
        let iconMoved = false, startX, startY, initialX, initialY, isDragging = false;

        dragIcon.addEventListener('pointerdown', (e) => {
            isDragging = true;
            iconMoved = false;
            startX = e.clientX;
            startY = e.clientY;
            initialX = e.clientX - dragIcon.offsetLeft;
            initialY = e.clientY - dragIcon.offsetTop;
            dragIcon.setPointerCapture(e.pointerId);
        });

        dragIcon.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            if (Math.abs(e.clientX - startX) > 4 || Math.abs(e.clientY - startY) > 4) {
                iconMoved = true;
            }
            let x = Math.max(0, Math.min(e.clientX - initialX, window.innerWidth - dragIcon.offsetWidth));
            let y = Math.max(0, Math.min(e.clientY - initialY, window.innerHeight - dragIcon.offsetHeight));
            dragIcon.style.left = x + "px";
            dragIcon.style.top = y + "px";
            dragIcon.style.position = 'fixed';
        });

        dragIcon.addEventListener('pointerup', (e) => {
            if (!iconMoved) toggleModal();
            isDragging = false;
            dragIcon.releasePointerCapture(e.pointerId);
        });

        // ২. পপআপ উইন্ডো ড্র্যাগ হ্যান্ডলার (হেডার ধরে সরাতে পারবে)
        const dragHeader = document.getElementById('dragHeader');
        let popDrag = false, popInitX, popInitY;

        dragHeader.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button')) return;
            popDrag = true;
            const rect = modal.getBoundingClientRect();
            modal.style.transform = 'none';
            modal.style.left = rect.left + 'px';
            modal.style.top = rect.top + 'px';
            popInitX = e.clientX - rect.left;
            popInitY = e.clientY - rect.top;
            dragHeader.setPointerCapture(e.pointerId);
        });

        dragHeader.addEventListener('pointermove', (e) => {
            if (!popDrag) return;
            let x = Math.max(0, Math.min(e.clientX - popInitX, window.innerWidth - modal.offsetWidth));
            let y = Math.max(0, Math.min(e.clientY - popInitY, window.innerHeight - modal.offsetHeight));
            modal.style.left = x + 'px';
            modal.style.top = y + 'px';
            modal.style.position = 'fixed';
        });

        dragHeader.addEventListener('pointerup', (e) => {
            popDrag = false;
            dragHeader.releasePointerCapture(e.pointerId);
        });
    </script>
</body>
</html>
