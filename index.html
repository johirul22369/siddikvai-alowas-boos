<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIDDIK OFFICIAL ORIGINAL AI HACK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Hind+Siliguri:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', 'Montserrat', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* ব্যাকগ্রাউন্ড গেম ফ্রেম (রেফারেল লিংক) */
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ফ্লোটিং ড্র্যাগেবল আইকন */
        .floating-icon {
            position: fixed;
            top: 100px;
            right: 20px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            background: #000;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.9);
            z-index: 9999;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
        }

        .floating-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* পপআপ মডাল বক্স */
        .overlay-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 380px;
            background: linear-gradient(145deg, rgba(18, 10, 35, 0.96), rgba(8, 3, 18, 0.99));
            border: 2px solid #ffd700;
            border-radius: 22px;
            box-shadow: 0 0 45px rgba(124, 58, 237, 0.8);
            backdrop-filter: blur(15px);
            z-index: 10000;
            padding: 22px;
            color: #fff;
            text-align: center;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 215, 0, 0.25);
            padding-bottom: 10px;
            margin-bottom: 18px;
        }

        .brand-title {
            font-size: 11px;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        /* পাসওয়ার্ড স্ক্রিন */
        .auth-screen {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 10px 0;
        }

        .auth-desc {
            font-size: 13px;
            color: #e2e8f0;
            font-weight: 600;
        }

        .input-box {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 2px solid rgba(255, 215, 0, 0.4);
            background: rgba(0, 0, 0, 0.7);
            color: #ffd700;
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            outline: none;
            transition: all 0.3s;
        }

        .input-box:focus {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #ffd700, #d97706);
            color: #000;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(217, 119, 6, 0.4);
            transition: transform 0.1s;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        /* প্রেডিকশন ড্যাশবোর্ড স্ক্রিন (সেন্টার ফোকাসড) */
        .dashboard-screen {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .status-text {
            font-size: 12px;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* পপআপের একদম মাঝখানের প্রিমিয়াম প্রেডিকশন বক্স */
        .prediction-box {
            position: relative;
            background: radial-gradient(circle, rgba(55, 15, 110, 0.85) 0%, rgba(8, 3, 22, 0.98) 100%);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 18px;
            padding: 30px 15px;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.9), 0 0 20px rgba(124, 58, 237, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .plane-anim {
            font-size: 34px;
            display: inline-block;
        }

        @keyframes flyCenter {
            0% { transform: translate(-25px, 12px) rotate(-12deg); }
            50% { transform: translate(0px, -12px) rotate(6deg); }
            100% { transform: translate(25px, 12px) rotate(-12deg); }
        }

        .flying {
            animation: flyCenter 0.45s infinite ease-in-out;
        }

        .prediction-display {
            font-size: 42px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- ১. ব্যাকগ্রাউন্ড গেম ফ্রেম -->
    <iframe class="game-frame" src="https://hgnice.bet/#/register?invitationCode=68758106622"></iframe>

    <!-- ২. ফ্লোটিং আইকন -->
    <div class="floating-icon" id="dragIcon">
        <img src="https://cdn.imageurlgenerator.com/uploads/3420d277-7bc7-4882-aa5e-11d91ee5e9e8.jpg" alt="Icon">
    </div>

    <!-- ৩. ওভারলে মডাল window -->
    <div class="overlay-modal" id="overlayModal">
        <div class="modal-header">
            <span class="brand-title">SIDDIK OFFICIAL ORIGINAL AI HACK</span>
            <button class="close-btn" onclick="toggleModal()">&times;</button>
        </div>

        <!-- সিকিউরিটি লগইন ইন্টারফেস -->
        <div class="auth-screen" id="authScreen">
            <div class="auth-desc">🔒 ভিআইপি এক্সেস পাসওয়ার্ড দিন</div>
            <input type="password" id="passInput" class="input-box" placeholder="পাসওয়ার্ড লিখুন">
            <button class="btn-action" onclick="verifyPassword()">UNLOCK HACK</button>
            <p id="errorMsg" style="color: #ff4d4d; font-size: 12px; font-weight: 700; display: none;">❌ ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন।</p>
        </div>

        <!-- এআই অটো-লুপ প্রেডিকশন ইন্টারফেস (মাঝখানে প্লেন ও গুণ সংখ্যা) -->
        <div class="dashboard-screen" id="dashScreen">
            <div class="status-text" id="statusText">AI SYSTEM CONNECTED</div>
            
            <div class="prediction-box">
                <div class="plane-anim" id="planeIcon">✈️</div>
                <div class="prediction-display" id="predResult">WAITING...</div>
            </div>

            <button class="btn-action" id="toggleAutoBtn" onclick="toggleAutoPrediction()">⚡ START AUTO HACK ⚡</button>
        </div>
    </div>

    <script>
        let modal = document.getElementById('overlayModal');
        let autoInterval = null;
        let isRunning = false;

        function toggleModal() {
            modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
        }

        // পাসওয়ার্ড ভেরিফিকেশন (siddik58)
        function verifyPassword() {
            let input = document.getElementById('passInput').value;
            let errorMsg = document.getElementById('errorMsg');

            if (input === 'siddik58') {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('dashScreen').style.display = 'flex';
                errorMsg.style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // অটো-লুপ প্রেডিকশন সিস্টেম স্টার্ট/স্টপ
        function toggleAutoPrediction() {
            let btn = document.getElementById('toggleAutoBtn');
            if (!isRunning) {
                isRunning = true;
                btn.innerText = "🛑 STOP AUTO HACK";
                btn.style.background = "linear-gradient(135deg, #ef4444, #991b1b)";
                btn.style.color = "#fff";
                startLoop();
            } else {
                stopLoop();
            }
        }

        function startLoop() {
            runSingleRound();
            autoInterval = setInterval(() => {
                if (isRunning) {
                    runSingleRound();
                }
            }, 8000);
        }

        function stopLoop() {
            isRunning = false;
            clearInterval(autoInterval);
            let btn = document.getElementById('toggleAutoBtn');
            btn.innerText = "⚡ START AUTO HACK ⚡";
            btn.style.background = "linear-gradient(135deg, #ffd700, #d97706)";
            btn.style.color = "#000";
            document.getElementById('statusText').innerText = "AI SYSTEM PAUSED";
            document.getElementById('planeIcon').classList.remove('flying');
        }

        function runSingleRound() {
            let predResult = document.getElementById('predResult');
            let statusText = document.getElementById('statusText');
            let planeIcon = document.getElementById('planeIcon');

            statusText.innerText = "🔄 ANALYZING NEXT ROUND...";
            predResult.innerText = "---";
            planeIcon.classList.remove('flying');

            setTimeout(() => {
                if (!isRunning) return;
                statusText.innerText = "✈️ FLIGHT IN PROGRESS...";
                planeIcon.classList.add('flying');

                let targetVal = (Math.random() * (5.50 - 1.25) + 1.25).toFixed(2);
                let currentVal = 1.00;

                let countInterval = setInterval(() => {
                    if (!isRunning) {
                        clearInterval(countInterval);
                        return;
                    }
                    currentVal += 0.15;
                    if (currentVal >= targetVal) {
                        currentVal = parseFloat(targetVal);
                        clearInterval(countInterval);
                        planeIcon.classList.remove('flying');
                        predResult.innerText = currentVal.toFixed(2) + "x";
                        statusText.innerText = "🎯 CRASH POINT PREDICTED";
                    } else {
                        predResult.innerText = currentVal.toFixed(2) + "x";
                    }
                }, 70);
            }, 2000);
        }

        // স্মুথ ড্রেগ-এন্ড-ড্রপ
        const dragIcon = document.getElementById('dragIcon');
        let isDragging = false, startX, startY, initialX, initialY;

        dragIcon.addEventListener('touchstart', dragStart, {passive: false});
        dragIcon.addEventListener('touchend', dragEnd, {passive: false});
        dragIcon.addEventListener('touchmove', drag, {passive: false});

        dragIcon.addEventListener('mousedown', dragStart);
        window.addEventListener('mouseup', dragEnd);
        window.addEventListener('mousemove', drag);

        function dragStart(e) {
            isDragging = true;
            let clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;

            initialX = clientX - dragIcon.offsetLeft;
            initialY = clientY - dragIcon.offsetTop;
        }

        function dragEnd() {
            isDragging = false;
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();

            let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;

            let x = clientX - initialX;
            let y = clientY - initialY;

            let maxX = window.innerWidth - dragIcon.offsetWidth;
            let maxY = window.innerHeight - dragIcon.offsetHeight;

            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));

            dragIcon.style.left = x + "px";
            dragIcon.style.top = y + "px";
            dragIcon.style.position = 'fixed';
        }

        let clickTime = 0;
        dragIcon.addEventListener('mousedown', () => clickTime = Date.now());
        dragIcon.addEventListener('touchstart', () => clickTime = Date.now());
        
        dragIcon.addEventListener('mouseup', (e) => {
            if (Date.now() - clickTime < 200) toggleModal();
        });
        dragIcon.addEventListener('touchend', (e) => {
            if (Date.now() - clickTime < 200) toggleModal();
        });
    </script>
</body>
</html>
