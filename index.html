<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIDDIK OFFICIAL ORIGINAL AI HACK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Montserrat:wght@700;800;900&family=Hind+Siliguri:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Hind Siliguri', sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05050a;
        }

        /* ১. ফুল স্ক্রিন ব্যাকগ্রাউন্ড গেম ফ্রেম */
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ২. ফ্লোটিং ড্র্যাগেবল আইকন */
        .floating-icon {
            position: fixed;
            top: 90px;
            right: 18px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2.5px solid #ffd700;
            background: radial-gradient(circle, #1e1b4b, #09090b);
            box-shadow: 0 0 22px rgba(255, 215, 0, 0.85);
            z-index: 9999;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .floating-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* ৩. প্রিমিয়াম ড্র্যাগেবল পপআপ কার্ড (স্ক্রিনশট স্টাইল) */
        .overlay-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            max-width: 375px;
            background: linear-gradient(160deg, #12131f 0%, #0a0b12 100%);
            border: 1.5px solid #ffd700;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95), 0 0 25px rgba(255, 165, 0, 0.25);
            z-index: 10000;
            padding: 14px;
            color: #fff;
            touch-action: none;
        }

        /* টপ ড্র্যাগ প্যানেল হেডার */
        .radar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px 10px;
            margin-bottom: 10px;
            cursor: move;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radar-icon-box {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(236, 72, 153, 0.15);
            border: 1px solid rgba(236, 72, 153, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .header-titles {
            text-align: left;
        }

        .main-brand {
            font-size: 11px;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge-radar {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            font-size: 8px;
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .sub-drag-text {
            font-size: 9px;
            color: #94a3b8;
            font-weight: 700;
            margin-top: 2px;
            letter-spacing: 0.4px;
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn.close:hover {
            background: rgba(239, 68, 68, 0.25);
            color: #f87171;
        }

        /* পাসওয়ার্ড স্ক্রিন */
        .auth-screen {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 18px 8px;
            text-align: center;
        }

        .auth-title {
            font-size: 12px;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 0.5px;
        }

        .input-box {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 215, 0, 0.5);
            background: #06070d;
            color: #ffd700;
            text-align: center;
            font-size: 15px;
            font-weight: 800;
            outline: none;
        }

        /* ড্যাশবোর্ড মেইন কন্টেইনার */
        .dashboard-screen {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        /* গেম সুইচার ট্যাব (AVIATOR এবং WINGO একসাথে) */
        .game-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #07080f;
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab-btn {
            padding: 8px;
            border-radius: 9px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ffd700, #f59e0b);
            color: #000;
            box-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
        }

        /* স্ট্যাটাস বার */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 10px;
            font-weight: 800;
            color: #e2e8f0;
        }

        .dot-live {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ec4899;
            display: inline-block;
            margin-right: 5px;
            box-shadow: 0 0 8px #ec4899;
        }

        .safe-badge {
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* গ্রিড প্রেডিকশন বক্স (স্ক্রিনশটের হুবহু ডিজাইন) */
        .radar-display-box {
            position: relative;
            height: 165px;
            border-radius: 14px;
            background-color: #160912;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                radial-gradient(circle at bottom right, rgba(225, 29, 72, 0.35), transparent 70%);
            background-size: 24px 24px, 24px 24px, 100% 100%;
            border: 1px solid rgba(244, 63, 94, 0.35);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        /* এভিয়েটর কার্ভ লাইন SVG */
        .curve-svg {
            position: absolute;
            bottom: 12px;
            left: 0;
            width: 100%;
            height: 110px;
            pointer-events: none;
            z-index: 1;
        }

        .locked-pill {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 215, 0, 0.35);
            color: #fde047;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .big-multiplier {
            position: relative;
            z-index: 2;
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }

        .sub-cashout {
            position: relative;
            z-index: 2;
            font-size: 10px;
            font-weight: 800;
            color: #fde68a;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* WinGo স্পেশাল ডিসপ্লে */
        .wingo-result-wrap {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .wingo-size {
            font-family: 'Orbitron', sans-serif;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 18px rgba(255, 215, 0, 0.7);
        }

        .wingo-badges {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .color-pill {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 900;
            color: #fff;
        }

        /* গ্লোয়িং GET SIGNAL বাটন (স্ক্রিনশট স্টাইল) */
        .btn-signal {
            width: 100%;
            padding: 14px;
            border-radius: 13px;
            border: none;
            background: linear-gradient(90deg, #ff1e56 0%, #ff7b00 100%);
            color: #fff;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1.2px;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(255, 30, 86, 0.45);
            transition: transform 0.1s;
        }

        .btn-signal:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- ব্যাকগ্রাউন্ড ফুল স্ক্রিন গেম -->
    <iframe class="game-frame" src="https://hgnice.bet/#/register?invitationCode=68758106622"></iframe>

    <!-- ফ্লোটিং আইকন -->
    <div class="floating-icon" id="dragIcon">
        <img src="https://cdn.imageurlgenerator.com/uploads/3420d277-7bc7-4882-aa5e-11d91ee5e9e8.jpg" alt="AI">
    </div>

    <!-- পপআপ মডাল -->
    <div class="overlay-modal" id="overlayModal">
        
        <!-- ড্র্যাগেবল টপ বার -->
        <div class="radar-header" id="dragHeader">
            <div class="header-left">
                <div class="radar-icon-box">✈️</div>
                <div class="header-titles">
                    <div class="main-brand">SIDDIK QUANTUM <span class="badge-radar">CRASH RADAR</span></div>
                    <div class="sub-drag-text">::: DRAG PANEL • VIP PRO AI</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="resetPanel()" title="Reset">↻</button>
                <button class="icon-btn close" id="closeBtn" title="Close">✕</button>
            </div>
        </div>

        <!-- পাসওয়ার্ড লগইন স্ক্রিন -->
        <div class="auth-screen" id="authScreen">
            <div class="auth-title">👑 SIDDIK OFFICIAL ORIGINAL AI HACK</div>
            <input type="password" id="passInput" class="input-box" placeholder="পাসওয়ার্ড দিন (siddik58)">
            <button class="btn-signal" onclick="verifyPassword()">🔓 UNLOCK VIP AI</button>
            <p id="errorMsg" style="color: #f87171; font-size: 11px; font-weight: 700; display: none;">❌ ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন।</p>
        </div>

        <!-- মেইন ড্যাশবোর্ড (AVIATOR + WINGO) -->
        <div class="dashboard-screen" id="dashScreen">
            
            <!-- মোড সুইচার ট্যাব -->
            <div class="game-tabs">
                <button class="tab-btn active" id="tabAviator" onclick="switchMode('aviator')">✈️ AVIATOR AI</button>
                <button class="tab-btn" id="tabWingo" onclick="switchMode('wingo')">🎯 WINGO AI</button>
            </div>

            <!-- স্ট্যাটাস বার -->
            <div class="status-bar">
                <span><span class="dot-live"></span><span id="serverName">SPRIBE AVIATOR AI #2</span></span>
                <span class="safe-badge">🛡️ 96.8% SAFE</span>
            </div>

            <!-- ১. AVIATOR ডিসপ্লে -->
            <div class="radar-display-box" id="aviatorView">
                <svg class="curve-svg" viewBox="0 0 300 100" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#ff1e56" stop-opacity="0.45"/>
                            <stop offset="100%" stop-color="#ff1e56" stop-opacity="0.0"/>
                        </linearGradient>
                    </defs>
                    <path d="M 10 92 Q 160 88, 285 12 L 285 100 L 10 100 Z" fill="url(#areaGrad)"/>
                    <path d="M 10 92 Q 160 88, 285 12" fill="none" stroke="#ff2a6d" stroke-width="3.5" stroke-linecap="round"/>
                </svg>
                <div class="locked-pill">✨ CASHOUT LOCKED</div>
                <div class="big-multiplier" id="aviatorVal">2.10x</div>
                <div class="sub-cashout" id="aviatorSub">AUTO CASHOUT @ 2.10X</div>
            </div>

            <!-- ২. WINGO ডিসপ্লে -->
            <div class="radar-display-box" id="wingoView" style="display: none;">
                <div class="locked-pill" id="wingoPeriod">PERIOD #2026111201</div>
                <div class="wingo-result-wrap">
                    <div class="wingo-size" id="wingoSize" style="color: #facc15;">BIG</div>
                    <div class="wingo-badges">
                        <span class="color-pill" id="wingoColor" style="background: #16a34a;">GREEN</span>
                        <span class="color-pill" id="wingoNum" style="background: rgba(255,255,255,0.15); border: 1px solid #ffd700;">NUMBER: 7</span>
                    </div>
                </div>
                <div class="sub-cashout" id="wingoSub" style="margin-top: 8px;">1 MIN WINGO • HIGH ACCURACY</div>
            </div>

            <!-- সিগন্যাল বাটন -->
            <button class="btn-signal" id="signalBtn" onclick="generateSignal()">⚡ GET SIGNAL</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('overlayModal');
        const dragIcon = document.getElementById('dragIcon');
        const dragHeader = document.getElementById('dragHeader');
        const closeBtn = document.getElementById('closeBtn');
        let currentMode = 'aviator';
        let isUnlocked = false;

        // পপআপ ওপেন/ক্লোজ
        function toggleModal() {
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'block';
                if (!isUnlocked) {
                    document.getElementById('authScreen').style.display = 'flex';
                    document.getElementById('dashScreen').style.display = 'none';
                }
            }
        }

        closeBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
        closeBtn.addEventListener('click', () => modal.style.display = 'none');

        function resetPanel() {
            modal.style.top = '50%';
            modal.style.left = '50%';
            modal.style.transform = 'translate(-50%, -50%)';
        }

        // পাসওয়ার্ড চেক (siddik58)
        function verifyPassword() {
            const val = document.getElementById('passInput').value.trim();
            const err = document.getElementById('errorMsg');
            if (val === 'siddik58') {
                isUnlocked = true;
                err.style.display = 'none';
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('dashScreen').style.display = 'flex';
            } else {
                err.style.display = 'block';
            }
        }

        // Aviator এবং WinGo মোড পরিবর্তন
        function switchMode(mode) {
            currentMode = mode;
            const tabAviator = document.getElementById('tabAviator');
            const tabWingo = document.getElementById('tabWingo');
            const aviatorView = document.getElementById('aviatorView');
            const wingoView = document.getElementById('wingoView');
            const serverName = document.getElementById('serverName');

            if (mode === 'aviator') {
                tabAviator.classList.add('active');
                tabWingo.classList.remove('active');
                aviatorView.style.display = 'flex';
                wingoView.style.display = 'none';
                serverName.innerText = 'SPRIBE AVIATOR AI #2';
            } else {
                tabWingo.classList.add('active');
                tabAviator.classList.remove('active');
                aviatorView.style.display = 'none';
                wingoView.style.display = 'flex';
                serverName.innerText = 'WINGO 1MIN SERVER #1';
                updateWingoPeriod();
            }
        }

        function updateWingoPeriod() {
            const now = new Date();
            const mins = now.getHours() * 60 + now.getMinutes() + 1;
            const periodStr = `20261112${String(mins).padStart(4, '0')}`;
            document.getElementById('wingoPeriod').innerText = `PERIOD #${periodStr}`;
        }

        // সিগন্যাল জেনারেটর (উভয় গেমের জন্য)
        function generateSignal() {
            const btn = document.getElementById('signalBtn');
            btn.disabled = true;
            btn.innerText = '⏳ ANALYZING SERVER...';

            if (currentMode === 'aviator') {
                const valEl = document.getElementById('aviatorVal');
                const subEl = document.getElementById('aviatorSub');
                valEl.innerText = '---';
                subEl.innerText = 'SCANNING CRASH ALGORITHM...';

                setTimeout(() => {
                    const mult = (Math.random() * (4.50 - 1.35) + 1.35).toFixed(2);
                    valEl.innerText = `${mult}x`;
                    subEl.innerText = `AUTO CASHOUT @ ${mult}X`;
                    btn.innerText = '⚡ GET SIGNAL';
                    btn.disabled = false;
                }, 1000);

            } else {
                updateWingoPeriod();
                const sizeEl = document.getElementById('wingoSize');
                const colorEl = document.getElementById('wingoColor');
                const numEl = document.getElementById('wingoNum');
                sizeEl.innerText = '...';

                setTimeout(() => {
                    const num = Math.floor(Math.random() * 10);
                    const isBig = num >= 5;
                    const isGreen = [1, 3, 5, 7, 9].includes(num);

                    sizeEl.innerText = isBig ? 'BIG' : 'SMALL';
                    sizeEl.style.color = isBig ? '#facc15' : '#38bdf8';

                    colorEl.innerText = isGreen ? 'GREEN' : 'RED';
                    colorEl.style.background = isGreen ? '#16a34a' : '#dc2626';

                    numEl.innerText = `NUMBER: ${num}`;
                    btn.innerText = '⚡ GET SIGNAL';
                    btn.disabled = false;
                }, 1000);
            }
        }

        // ১. ফ্লোটিং আইকন ড্র্যাগ + ইনস্ট্যান্ট ক্লিক
        let iconDrag = false, iconMoved = false, iStartX, iStartY, iInitX, iInitY;

        dragIcon.addEventListener('pointerdown', (e) => {
            iconDrag = true;
            iconMoved = false;
            iStartX = e.clientX;
            iStartY = e.clientY;
            iInitX = e.clientX - dragIcon.offsetLeft;
            iInitY = e.clientY - dragIcon.offsetTop;
            dragIcon.setPointerCapture(e.pointerId);
        });

        dragIcon.addEventListener('pointermove', (e) => {
            if (!iconDrag) return;
            if (Math.abs(e.clientX - iStartX) > 4 || Math.abs(e.clientY - iStartY) > 4) {
                iconMoved = true;
            }
            let x = Math.max(0, Math.min(e.clientX - iInitX, window.innerWidth - dragIcon.offsetWidth));
            let y = Math.max(0, Math.min(e.clientY - iInitY, window.innerHeight - dragIcon.offsetHeight));
            dragIcon.style.left = x + 'px';
            dragIcon.style.top = y + 'px';
        });

        dragIcon.addEventListener('pointerup', (e) => {
            if (!iconMoved) toggleModal();
            iconDrag = false;
            dragIcon.releasePointerCapture(e.pointerId);
        });

        // ২. পপআপ ড্র্যাগ প্যানেল
        let popDrag = false, pInitX, pInitY;

        dragHeader.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button')) return;
            popDrag = true;
            const rect = modal.getBoundingClientRect();
            modal.style.transform = 'none';
            modal.style.left = rect.left + 'px';
            modal.style.top = rect.top + 'px';
            pInitX = e.clientX - rect.left;
            pInitY = e.clientY - rect.top;
            dragHeader.setPointerCapture(e.pointerId);
        });

        dragHeader.addEventListener('pointermove', (e) => {
            if (!popDrag) return;
            let x = Math.max(0, Math.min(e.clientX - pInitX, window.innerWidth - modal.offsetWidth));
            let y = Math.max(0, Math.min(e.clientY - pInitY, window.innerHeight - modal.offsetHeight));
            modal.style.left = x + 'px';
            modal.style.top = y + 'px';
        });

        dragHeader.addEventListener('pointerup', (e) => {
            popDrag = false;
            dragHeader.releasePointerCapture(e.pointerId);
        });
    </script>
</body>
</html>
