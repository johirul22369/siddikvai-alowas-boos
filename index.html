<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIDDIK OFFICIAL ORIGINAL AI HACK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Hind+Siliguri:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', 'Montserrat', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* ব্যাকগ্রাউন্ড গেম ফ্রেম */
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ফ্লোটিং ড্র্যাগেবল আইকন */
        .floating-icon {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            background: #000;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            z-index: 9999;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .floating-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* পপআপ মডাল বক্স */
        .overlay-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 360px;
            background: linear-gradient(135deg, rgba(15, 7, 32, 0.95), rgba(30, 10, 60, 0.95));
            border: 2px solid #ffd700;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.6);
            backdrop-filter: blur(10px);
            z-index: 10000;
            padding: 20px;
            color: #fff;
            text-align: center;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .brand-title {
            font-size: 13px;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 0.5px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* পাসওয়ার্ড স্ক্রিন */
        .auth-screen {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-box {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #ffd700;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            text-align: center;
            font-size: 14px;
            outline: none;
        }

        .btn-action {
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ffd700, #d97706);
            color: #000;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* প্রেডিকশন ড্যাশবোর্ড স্ক্রিন */
        .dashboard-screen {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .prediction-display {
            background: rgba(0, 0, 0, 0.7);
            border: 1px dashed #ffd700;
            border-radius: 14px;
            padding: 20px;
            font-size: 32px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .status-text {
            font-size: 12px;
            color: #a7f3d0;
        }
    </style>
</head>
<body>

    <!-- ১. ব্যাকগ্রাউন্ডে রেফারেল গেম পেজ -->
    <iframe class="game-frame" src="https://hgnice.bet/#/register?invitationCode=68758106622"></iframe>

    <!-- ২. ফ্লোটিং আইকন -->
    <div class="floating-icon" id="dragIcon" onclick="toggleModal()">
        <img src="https://cdn.imageurlgenerator.com/uploads/3420d277-7bc7-4882-aa5e-11d91ee5e9e8.jpg" alt="Icon">
    </div>

    <!-- ৩. ওভারলে মডাল window -->
    <div class="overlay-modal" id="overlayModal">
        <div class="modal-header">
            <span class="brand-title">👑 SIDDIK OFFICIAL AI HACK</span>
            <button class="close-btn" onclick="toggleModal()">&times;</button>
        </div>

        <!-- সিকিউরিটি লগইন ইন্টারফেস -->
        <div class="auth-screen" id="authScreen">
            <p style="font-size: 12px; color: #cbd5e1;">টুল একসেস করতে পাসওয়ার্ড দিন:</p>
            <input type="password" id="passInput" class="input-box" placeholder="পাসওয়ার্ড লিখুন">
            <button class="btn-action" onclick="verifyPassword()">LOGIN</button>
            <p id="errorMsg" style="color: #ef4444; font-size: 11px; display: none;">ভুল পাসওয়ার্ড!</p>
        </div>

        <!-- এআই প্রেডিকশন ইন্টারফেস -->
        <div class="dashboard-screen" id="dashScreen">
            <div class="status-text" id="statusText">SYSTEM READY</div>
            <div class="prediction-display" id="predResult">0.00x</div>
            <button class="btn-action" onclick="runPrediction()">⚡ PREDICT NEXT ⚡</button>
        </div>
    </div>

    <script>
        // মডাল খোলা বা বন্ধ করা
        function toggleModal() {
            let modal = document.getElementById('overlayModal');
            modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
        }

        // পাসওয়ার্ড ভেরিফিকেশন (siddik58)
        function verifyPassword() {
            let input = document.getElementById('passInput').value;
            let errorMsg = document.getElementById('errorMsg');

            if (input === 'siddik58') {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('dashScreen').style.display = 'flex';
                errorMsg.style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // প্রেডিকশন সিমুলেশন লজিক
        function runPrediction() {
            let predResult = document.getElementById('predResult');
            let statusText = document.getElementById('statusText');

            statusText.innerText = "ANALYZING GAME DATA...";
            predResult.innerText = "WAIT...";

            setTimeout(() => {
                let randomVal = (Math.random() * (4.50 - 1.20) + 1.20).toFixed(2);
                predResult.innerText = randomVal + "x";
                statusText.innerText = "PREDICTION COMPLETE";
            }, 1200);
        }

        // ফ্লোটিং আইকন ড্র্যাগ করার ফিচার (মোবাইল ও পিসি)
        const dragIcon = document.getElementById('dragIcon');
        let isDragging = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

        dragIcon.addEventListener('touchstart', dragStart, false);
        dragIcon.addEventListener('touchend', dragEnd, false);
        dragIcon.addEventListener('touchmove', drag, false);
        dragIcon.addEventListener('mousedown', dragStart, false);
        dragIcon.addEventListener('mouseup', dragEnd, false);
        dragIcon.addEventListener('mousemove', drag, false);

        function dragStart(e) {
            if (e.type === "touchstart") {
                initialX = e.touches[0].clientX - xOffset;
                initialY = e.touches[0].clientY - yOffset;
            } else {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
            }
            if (e.target === dragIcon || dragIcon.contains(e.target)) {
                isDragging = true;
            }
        }

        function dragEnd() {
            initialX = currentX;
            initialY = currentY;
            isDragging = false;
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                if (e.type === "touchmove") {
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                } else {
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                }
                xOffset = currentX;
                yOffset = currentY;
                setTranslate(currentX, currentY, dragIcon);
            }
        }

        function setTranslate(xPos, yPos, el) {
            el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
        }
    </script>
</body>
</html>
