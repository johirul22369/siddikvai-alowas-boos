<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIDDIK OFFICIAL ORIGINAL AI HACK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Hind+Siliguri:wght@700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', 'Montserrat', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* ব্যাকগ্রাউন্ড গেম ফ্রেম */
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* গেমের ওপর হালকা ব্লার ও ডার্ক শ্যাডো ওভারলে */
        .bg-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(3px);
            z-index: 9998;
        }

        /* ফ্লোটিং ড্র্যাগেবল আইকন */
        .floating-icon {
            position: fixed;
            top: 100px;
            right: 20px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            background: #000;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.9);
            z-index: 10001;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
        }

        .floating-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* ড্র্যাগেবল পপআপ ফ্রেম (তোর দেওয়া নতুন ইমেজ ব্যাকগ্রাউন্ড)[span_0](start_span)[span_0](end_span) */
        .overlay-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            max-width: 380px;
            height: 450px;
            background: url('https://imagepaste.org/i/61337.png') no-repeat center center;
            background-size: 100% 100%;
            filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.95));
            z-index: 10000;
            touch-action: none;
            user-select: none;
        }

        /* পপআপ ড্র্যাগ হেডার ও ক্লোজ বাটন */
        .popup-header {
            width: 100%;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 20px;
            cursor: move;
        }

        .close-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* পাসওয়ার্ড স্ক্রিন (ফ্রেমের ফাঁকা জায়গায় এডজাস্ট করা) */
        .auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            height: calc(100% - 50px);
            padding: 0 35px;
        }

        .auth-desc {
            font-size: 13px;
            color: #ffd700;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(0,0,0,0.9);
        }

        .input-box {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #ffd700;
            background: rgba(0, 0, 0, 0.9);
            color: #ffd700;
            text-align: center;
            font-size: 15px;
            font-weight: 800;
            outline: none;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ffd700, #d97706);
            color: #000;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.6);
        }

        /* প্রেডিকশন ওভারলে (ফ্রেমের মাঝখানের ফাঁকা অংশে সিগন্যাল দেখানোর জন্য) */
        .dashboard-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100% - 50px);
            position: relative;
            padding: 0 35px;
        }

        .prediction-display {
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px #ffd700, 0 0 30px #ff4500;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .status-text {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        .get-signal-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: #fff;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.5);
        }
    </style>
</head>
<body>

    <!-- ১. ব্যাকগ্রাউন্ড গেম ফ্রেম -->
    <iframe class="game-frame" src="https://hgnice.bet/#/register?invitationCode=68758106622"></iframe>

    <!-- ২. হালকা ব্লার ও শ্যাডো ওভারলে -->
    <div class="bg-overlay" id="bgOverlay"></div>

    <!-- ৩. ফ্লোটিং ড্র্যাগেবল আইকন -->
    <div class="floating-icon" id="dragIcon">
        <img src="https://cdn.imageurlgenerator.com/uploads/3420d277-7bc7-4882-aa5e-11d91ee5e9e8.jpg" alt="Icon">
    </div>

    <!-- ৪. ড্র্যাগেবল পপআপ ফ্রেম (তোর দেওয়া নতুন ইমেজ ডিজাইন)[span_1](start_span)[span_1](end_span) -->
    <div class="overlay-modal" id="overlayModal">
        <div class="popup-header" id="popupHeader">
            <button class="close-btn" onclick="toggleModal()">&times;</button>
        </div>

        <!-- সিকিউরিটি পাসওয়ার্ড স্ক্রিন -->
        <div class="auth-screen" id="authScreen">
            <div class="auth-desc">🔑 VIP ACCESS PASSWORD</div>
            <input type="password" id="passInput" class="input-box" placeholder="পাসওয়ার্ড লিখুন">
            <button class="btn-action" onclick="verifyPassword()">UNLOCK HACK</button>
            <p id="errorMsg" style="color: #ff4d4d; font-size: 11px; font-weight: 700; display: none;">❌ ভুল পাসওয়ার্ড!</p>
        </div>

        <!-- ফ্রেমের মাঝখানের প্রেডিকশন ড্যাশবোর্ড -->
        <div class="dashboard-screen" id="dashScreen">
            <div class="prediction-display" id="predResult">2.10x</div>
            <div class="status-text" id="statusText">AUTO CASHOUT @ 2.10X</div>
            <button class="get-signal-btn" id="signalBtn" onclick="getSignal()">⚡ GET SIGNAL ⚡</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('overlayModal');
        const overlay = document.getElementById('bgOverlay');

        function toggleModal() {
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
                overlay.style.display = 'none';
            } else {
                modal.style.display = 'block';
                overlay.style.display = 'block';
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('dashScreen').style.display = 'none';
                document.getElementById('passInput').value = '';
                document.getElementById('errorMsg').style.display = 'none';
            }
        }

        // পাসওয়ার্ড ভেরিফিকেশন (siddik58)
        function verifyPassword() {
            let input = document.getElementById('passInput').value;
            let errorMsg = document.getElementById('errorMsg');

            if (input === 'siddik58') {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('dashScreen').style.display = 'flex';
                errorMsg.style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // সিগন্যাল জেনারেটর
        function getSignal() {
            let predResult = document.getElementById('predResult');
            let statusText = document.getElementById('statusText');
            let btn = document.getElementById('signalBtn');

            btn.disabled = true;
            btn.innerText = "ANALYZING...";
            predResult.innerText = "---";
            statusText.innerText = "SCANNING GAME DATA...";

            setTimeout(() => {
                let targetVal = (Math.random() * (4.80 - 1.35) + 1.35).toFixed(2);
                predResult.innerText = targetVal + "x";
                statusText.innerText = "AUTO CASHOUT @ " + targetVal + "X";
                btn.innerText = "⚡ GET SIGNAL ⚡";
                btn.disabled = false;
            }, 1200);
        }

        // ১. আইকন ড্র্যাগ ও ক্লিক হ্যান্ডলার
        const dragIcon = document.getElementById('dragIcon');
        let iconMoved = false;

        makeElementDraggable(dragIcon, dragIcon, () => {
            if (!iconMoved) toggleModal();
        });

        function makeElementDraggable(element, handle, onClick) {
            let isDragging = false, initialX, initialY, startX, startY;

            handle.addEventListener('touchstart', (e) => {
                iconMoved = false;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                dragStart(e);
            }, {passive: false});

            window.addEventListener('touchend', (e) => {
                if (isDragging) {
                    isDragging = false;
                    let endX = e.changedTouches[0].clientX;
                    let endY = e.changedTouches[0].clientY;
                    if (Math.abs(endX - startX) < 6 && Math.abs(endY - startY) < 6) {
                        if (onClick) onClick();
                    }
                }
            });

            window.addEventListener('touchmove', (e) => {
                if (isDragging) {
                    iconMoved = true;
                    drag(e);
                }
            }, {passive: false});

            handle.addEventListener('mousedown', (e) => {
                iconMoved = false;
                startX = e.clientX;
                startY = e.clientY;
                dragStart(e);
            });

            window.addEventListener('mouseup', (e) => {
                if (isDragging) {
                    isDragging = false;
                    if (Math.abs(e.clientX - startX) < 6 && Math.abs(e.clientY - startY) < 6) {
                        if (onClick) onClick();
                    }
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    iconMoved = true;
                    drag(e);
                }
            });

            function dragStart(e) {
                isDragging = true;
                let clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
                initialX = clientX - element.offsetLeft;
                initialY = clientY - element.offsetTop;
            }

            function drag(e) {
                if (!isDragging) return;
                e.preventDefault();
                let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
                element.style.left = (clientX - initialX) + "px";
                element.style.top = (clientY - initialY) + "px";
                element.style.transform = "none";
                element.style.position = 'fixed';
            }
        }

        // ২. পপআপ ফ্রেম ড্র্যাগ হ্যান্ডলার
        const popupHeader = document.getElementById('popupHeader');
        makePopupDraggable(modal, popupHeader);

        function makePopupDraggable(element, handle) {
            let isDragging = false, initialX, initialY;

            handle.addEventListener('touchstart', (e) => {
                if (e.target.classList.contains('close-btn')) return;
                isDragging = true;
                initialX = e.touches[0].clientX - element.offsetLeft;
                initialY = e.touches[0].clientY - element.offsetTop;
            }, {passive: false});

            window.addEventListener('touchend', () => isDragging = false);

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                element.style.left = (e.touches[0].clientX - initialX) + "px";
                element.style.top = (e.touches[0].clientY - initialY) + "px";
                element.style.transform = "none";
                element.style.position = 'fixed';
            }, {passive: false});

            handle.addEventListener('mousedown', (e) => {
                if (e.target.classList.contains('close-btn')) return;
                isDragging = true;
                initialX = e.clientX - element.offsetLeft;
                initialY = e.clientY - element.offsetTop;
            });

            window.addEventListener('mouseup', () => isDragging = false);

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                element.style.left = (e.clientX - initialX) + "px";
                element.style.top = (e.clientY - initialY) + "px";
                element.style.transform = "none";
                element.style.position = 'fixed';
            });
        }
    </script>
</body>
</html>
