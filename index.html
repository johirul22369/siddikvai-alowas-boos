<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIDDIK OFFICIAL ORIGINAL AI HACK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Hind+Siliguri:wght@700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', 'Montserrat', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* ব্যাকগ্রাউন্ড গেম ফ্রেম (রেফারেল লিংক) */
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ডার্ক ও ব্লার ব্যাকগ্রাউন্ড শ্যাডো */
        .bg-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(3px);
            z-index: 9998;
        }

        /* ফ্লোটিং ড্র্যাগেবল আইকন */
        .floating-icon {
            position: fixed;
            top: 100px;
            right: 20px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            background: #000;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.9);
            z-index: 10001;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
        }

        .floating-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* তোর দেওয়া অরিজিনাল ঈগল ফ্রেমের ড্র্যাগেবল পপআপ */
        .overlay-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            max-width: 380px;
            height: 450px;
            background: url('https://imagepaste.org/i/61337.png') no-repeat center center;
            background-size: 100% 100%;
            filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.95));
            z-index: 10000;
            touch-action: none;
            user-select: none;
        }

        /* পপআপ ড্র্যাগ হেডার ও ক্লোজ বাটন */
        .popup-header {
            width: 100%;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 20px;
            cursor: move;
        }

        .close-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 1.5px solid #ff4d4d;
            color: #ff4d4d;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* পাসওয়ার্ড স্ক্রিন (ফ্রেমের একদম ঠিক মাঝখানে সেট করা) */
        .auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            height: calc(100% - 75px);
            padding: 0 40px;
        }

        .auth-desc {
            font-size: 13px;
            color: #ffd700;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }

        .input-box {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #ffd700;
            background: rgba(0, 0, 0, 0.9);
            color: #ffd700;
            text-align: center;
            font-size: 15px;
            font-weight: 800;
            outline: none;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ffd700, #d97706);
            color: #000;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.6);
        }

        /* এআই লাইভ প্রেডিকশন স্ক্রিন (ফ্রেমের ভেতরে) */
        .dashboard-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100% - 75px);
            position: relative;
            padding: 0 35px;
        }

        .plane-anim {
            font-size: 26px;
            display: inline-block;
            margin-bottom: 2px;
        }

        @keyframes fly {
            0% { transform: translate(-15px, 8px) rotate(-10deg); }
            50% { transform: translate(0px, -8px) rotate(5deg); }
            100% { transform: translate(15px, 8px) rotate(-10deg); }
        }

        .flying {
            animation: fly 0.5s infinite ease-in-out;
        }

        .prediction-display {
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px #ffd700, 0 0 30px #ff4500;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .status-text {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 800;
            margin-bottom: 12px;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        .get-signal-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: #fff;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.5);
        }
    </style>
</head>
<body>

    <!-- ১. ব্যাকগ্রাউন্ড গেম ফ্রেম -->
    <iframe class="game-frame" src="https://hgnice.bet/#/register?invitationCode=68758106622"></iframe>

    <!-- ২. ব্লার ও শ্যাডো ব্যাকগ্রাউন্ড -->
    <div class="bg-overlay" id="bgOverlay"></div>

    <!-- ৩. ফ্লোটিং ড্র্যাগেবল আইকন -->
    <div class="floating-icon" id="dragIcon">
        <img src="https://cdn.imageurlgenerator.com/uploads/3420d277-7bc7-4882-aa5e-11d91ee5e9e8.jpg" alt="Icon">
    </div>

    <!-- ৪. ড্র্যাগেবল ঈগল ফ্রেম পপআপ (অরিজিনাল ডিজাইন)[span_1](start_span)[span_1](end_span) -->
    <div class="overlay-modal" id="overlayModal">
        <div class="popup-header" id="popupHeader">
            <button class="close-btn" id="closeBtn">&times;</button>
        </div>

        <!-- সিকিউরিটি পাসওয়ার্ড স্ক্রিন -->
        <div class="auth-screen" id="authScreen">
            <div class="auth-desc">🔑 VIP ACCESS PASSWORD</div>
            <input type="password" id="passInput" class="input-box" placeholder="পাসওয়ার্ড লিখুন">
            <button class="btn-action" onclick="verifyPassword()">UNLOCK HACK</button>
            <p id="errorMsg" style="color: #ff4d4d; font-size: 11px; font-weight: 700; display: none;">❌ ভুল পাসওয়ার্ড!</p>
        </div>

        <!-- ফ্রেমের ভেতরের প্রেডিকশন ইন্টারফেস -->
        <div class="dashboard-screen" id="dashScreen">
            <div class="plane-anim" id="planeIcon">✈️</div>
            <div class="prediction-display" id="predResult">2.10x</div>
            <div class="status-text" id="statusText">AUTO CASHOUT @ 2.10X</div>
            <button class="get-signal-btn" id="signalBtn" onclick="toggleAutoPrediction()">⚡ START AUTO HACK ⚡</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('overlayModal');
        const overlay = document.getElementById('bgOverlay');
        const closeBtn = document.getElementById('closeBtn');
        let isRunning = false;
        let autoInterval = null;

        // পপআপ টগল (আইকনে ক্লিক করলে কাজ করবে)
        function toggleModal() {
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
                overlay.style.display = 'none';
            } else {
                modal.style.display = 'block';
                overlay.style.display = 'block';
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('dashScreen').style.display = 'none';
                document.getElementById('passInput').value = '';
                document.getElementById('errorMsg').style.display = 'none';
            }
        }

        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleModal();
        });

        // পাসওয়ার্ড ভেরিফিকেশন (siddik58)
        function verifyPassword() {
            let input = document.getElementById('passInput').value;
            let errorMsg = document.getElementById('errorMsg');

            if (input === 'siddik58') {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('dashScreen').style.display = 'flex';
                errorMsg.style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // অটো-লুপ ও রিয়েল-টাইম মার্কেট প্রেডিকশন
        function toggleAutoPrediction() {
            let btn = document.getElementById('signalBtn');
            if (!isRunning) {
                isRunning = true;
                btn.innerText = "🛑 STOP AUTO HACK";
                btn.style.background = "linear-gradient(135deg, #ef4444, #991b1b)";
                startLoop();
            } else {
                stopLoop();
            }
        }

        function startLoop() {
            runSingleRound();
            autoInterval = setInterval(() => {
                if (isRunning) runSingleRound();
            }, 8000);
        }

        function stopLoop() {
            isRunning = false;
            clearInterval(autoInterval);
            let btn = document.getElementById('signalBtn');
            btn.innerText = "⚡ START AUTO HACK ⚡";
            btn.style.background = "linear-gradient(135deg, #22c55e, #15803d)";
            document.getElementById('statusText').innerText = "AI SYSTEM PAUSED";
            document.getElementById('planeIcon').classList.remove('flying');
        }

        function runSingleRound() {
            let predResult = document.getElementById('predResult');
            let statusText = document.getElementById('statusText');
            let planeIcon = document.getElementById('planeIcon');

            statusText.innerText = "🔄 ANALYZING GAME MARKET...";
            predResult.innerText = "---";
            planeIcon.classList.remove('flying');

            setTimeout(() => {
                if (!isRunning) return;
                statusText.innerText = "✈️ FLIGHT IN PROGRESS...";
                planeIcon.classList.add('flying');

                let targetVal = (Math.random() * (4.80 - 1.30) + 1.30).toFixed(2);
                let currentVal = 1.00;

                let countInterval = setInterval(() => {
                    if (!isRunning) {
                        clearInterval(countInterval);
                        return;
                    }
                    currentVal += 0.15;
                    if (currentVal >= targetVal) {
                        currentVal = parseFloat(targetVal);
                        clearInterval(countInterval);
                        planeIcon.classList.remove('flying');
                        predResult.innerText = currentVal.toFixed(2) + "x";
                        statusText.innerText = "🎯 CRASH POINT PREDICTED";
                    } else {
                        predResult.innerText = currentVal.toFixed(2) + "x";
                    }
                }, 70);
            }, 2000);
        }

        // ১. আইকন ড্র্যাগ ও ক্লিকে পপআপ ওপেন ফিক্সড লজিক
        const dragIcon = document.getElementById('dragIcon');
        let iconDragging = false;
        let startX, startY;

        dragIcon.addEventListener('touchstart', (e) => {
            iconDragging = false;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            dragStart(e);
        }, {passive: false});

        window.addEventListener('touchmove', (e) => {
            if (iconDragging) drag(e);
        }, {passive: false});

        window.addEventListener('touchend', (e) => {
            if (iconDragging) {
                let endX = e.changedTouches[0].clientX;
                let endY = e.changedTouches[0].clientY;
                if (Math.abs(endX - startX) < 5 && Math.abs(endY - startY) < 5) {
                    toggleModal();
                }
                iconDragging = false;
            }
        });

        dragIcon.addEventListener('mousedown', (e) => {
            iconDragging = false;
            startX = e.clientX;
            startY = e.clientY;
            dragStart(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (iconDragging) drag(e);
        });

        window.addEventListener('mouseup', (e) => {
            if (iconDragging) {
                if (Math.abs(e.clientX - startX) < 5 && Math.abs(e.clientY - startY) < 5) {
                    toggleModal();
                }
                iconDragging = false;
            }
        });

        let initialX, initialY;
        function dragStart(e) {
            iconDragging = true;
            let clientX = e.type.includes("touch") ? e.touches[0].clientX : e.clientX;
            let clientY = e.type.includes("touch") ? e.touches[0].clientY : e.clientY;
            initialX = clientX - dragIcon.offsetLeft;
            initialY = clientY - dragIcon.offsetTop;
        }

        function drag(e) {
            if (!iconDragging) return;
            e.preventDefault();
            let clientX = e.type.includes("touch") ? e.touches[0].clientX : e.clientX;
            let clientY = e.type.includes("touch") ? e.touches[0].clientY : e.clientY;
            
            let x = clientX - initialX;
            let y = clientY - initialY;

            x = Math.max(0, Math.min(x, window.innerWidth - dragIcon.offsetWidth));
            y = Math.max(0, Math.min(y, window.innerHeight - dragIcon.offsetHeight));

            dragIcon.style.left = x + "px";
            dragIcon.style.top = y + "px";
            dragIcon.style.position = 'fixed';
        }

        // ২. ঈগল পপআপ ফ্রেম ড্র্যাগিং লজিক
        const popupHeader = document.getElementById('popupHeader');
        let popupDragging = false, popInitialX, popInitialY;

        popupHeader.addEventListener('touchstart', (e) => {
            if (e.target.classList.contains('close-btn')) return;
            popupDragging = true;
            popInitialX = e.touches[0].clientX - modal.offsetLeft;
            popInitialY = e.touches[0].clientY - modal.offsetTop;
        }, {passive: false});

        window.addEventListener('touchend', () => popupDragging = false);

        window.addEventListener('touchmove', (e) => {
            if (!popupDragging) return;
            e.preventDefault();
            modal.style.left = (e.touches[0].clientX - popInitialX) + "px";
            modal.style.top = (e.touches[0].clientY - popInitialY) + "px";
            modal.style.transform = "none";
            modal.style.position = 'fixed';
        }, {passive: false});

        popupHeader.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('close-btn')) return;
            popupDragging = true;
            popInitialX = e.clientX - modal.offsetLeft;
            popInitialY = e.clientY - modal.offsetTop;
        });

        window.addEventListener('mouseup', () => popupDragging = false);

        window.addEventListener('mousemove', (e) => {
            if (!popupDragging) return;
            modal.style.left = (e.clientX - popInitialX) + "px";
            modal.style.top = (e.clientY - popInitialY) + "px";
            modal.style.transform = "none";
            modal.style.position = 'fixed';
        });
    </script>
</body>
</html>
